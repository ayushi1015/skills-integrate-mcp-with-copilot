<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <button id="admin-menu-button" class="admin-menu-button" type="button" aria-label="Open admin login">
        &#128100;
      </button>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <div id="admin-modal" class="admin-modal hidden" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
      <div class="admin-modal-content">
        <button id="admin-modal-close" class="admin-modal-close" type="button" aria-label="Close login window">&times;</button>
        <h3 id="admin-modal-title">Teacher Login</h3>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" autocomplete="current-password" required />
          </div>
          <button type="submit">Login</button>
        </form>
        <div id="login-status" class="hidden"></div>
      </div>
    </div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list" class="activity-grid">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
        <div id="message" class="message hidden" role="status" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
